 x="290" y="475" width="380" height="24" rx="6" fill="#ecd9d9"/><text x="480" y="488.0" font-size="15" fill="#8a7f6a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="480" dy="0">never encoded</tspan></text><text x="600" y="590.0" font-size="17" fill="#8a7f6a" text-anchor="middle" font-weight="italic" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">Faces don't lie. Spreadsheets lie a little.</tspan></text></svg>