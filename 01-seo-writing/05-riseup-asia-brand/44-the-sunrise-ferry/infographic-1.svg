<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><title>The GenAI Divide</title><rect width="1200" height="630" fill="#faf7f0"/><text x="600" y="606" font-size="15" fill="#8a7f6a" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">RISEUP ASIA LLC · story series</text><text x="600" y="64" font-size="34" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">The GenAI Divide</tspan></text><text x="600" y="108" font-size="18" fill="#8a7f6a" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">MIT Project NANDA · State of AI in Business 2025</tspan></text><rect x="520" y="126" width="160" height="5" rx="2.5" fill="#b98a2f"/><rect x="90" y="180" width="340" height="280" rx="14" fill="#ffffff" stroke="#b98a2f" stroke-width="2"/><text x="260" y="300" font-size="56" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="260" dy="0">95%</tspan></text><text x="260" y="352" font-size="20" fill="#8a7f6a" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="260" dy="0">pilots: no measurable P&amp;L</tspan></text><text x="260" y="382" font-size="20" fill="#8a7f6a" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="260" dy="0">impact</tspan></text><rect x="430" y="180" width="340" height="280" rx="14" fill="#ffffff" stroke="#b98a2f" stroke-width="2"/><text x="600" y="300" font-size="56" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">$30-40B</tspan></text><text x="600" y="352" font-size="20" fill="#8a7f6a" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">enterprise spending behind</tspan></text><text x="600" y="382" font-size="20" fill="#8a7f6a" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">them</tspan></text><rect x="770" y="180" width="340" height="280" rx="14" fill="#ffffff" stroke="#b98a2f" stroke-width="2"/><text x="940" y="300" font-size="56" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="940" dy="0">5%</tspan></text><text x="940" y="352" font-size="20" fill="#8a7f6a" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="940" dy="0">rapid revenue acceleration</tspan></text><text x="600" y="520" font-size="17" fill="#5a5348" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">The technology works. The organization around it does not move fast enough.</tspan></text></svg>