<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>construction bookkeeping concept</title><desc>Layered recreation: yellow flat-lay poster. Photo props are labeled placeholders.</desc>
<defs><radialGradient id="cbg" cx="50%" cy="42%" r="75%"><stop offset="0%" stop-color="#ffd83d"/><stop offset="100%" stop-color="#efa900"/></radialGradient></defs>
<g id="bg-base"><rect width="1080" height="1350" fill="url(#cbg)"/></g>
<g id="headline"><text x="540" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="900" fill="#111">CONSTRUCTION BOOKKEEPING</text></g>
<g id="photo-blueprint-sheet"><rect x="240" y="320" width="600" height="640" fill="#ffffff" stroke="#d8d8d8" stroke-width="2"/><rect x="300" y="420" width="480" height="26" fill="#dfe7ee"/><rect x="300" y="470" width="380" height="200" fill="#2f6db3" opacity="0.85"/><rect x="300" y="700" width="480" height="18" fill="#e4e4e4"/><rect x="300" y="730" width="480" height="18" fill="#e4e4e4"/><rect x="300" y="760" width="300" height="18" fill="#e4e4e4"/></g>
<g id="photo-props-note"><rect x="240" y="990" width="600" height="90" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="14 10" opacity="0.5"/><text x="540" y="1045" text-anchor="middle" font-family="Arial" font-size="28" fill="#111" opacity="0.6">photo props: helmet, calculator, pencil</text></g>
<g id="footer"><text x="540" y="1200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#111">Let us handle your books, so you can build!</text></g>
</svg>