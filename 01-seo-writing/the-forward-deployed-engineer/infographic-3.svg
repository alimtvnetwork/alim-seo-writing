<text x="600" y="152" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#5b6b7f" text-anchor="middle">My editorial criterion: what moves a system from pilot to production</text>
<circle cx="92" cy="202" r="26" fill="#0f2a44"/><text x="92" y="212" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="142" y="210" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0f2a44">Read client data first</text><text x="142" y="242" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#5b6b7f">real requirements live in the logs</text><circle cx="92" cy="278" r="26" fill="#0f2a44"/><text x="92" y="288" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="142" y="286" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0f2a44">Ship in weeks, not quarters</text><text x="142" y="318" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#5b6b7f">real data teaches faster</text><circle cx="92" cy="354" r="26" fill="#0f2a44"/><text x="92" y="364" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="142" y="362" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0f2a44">Say no with evidence</text><text x="142" y="394" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#5b6b7f">protect the client wish list</text><circle cx="92" cy="430" r="26" fill="#0f2a44"/><text x="92" y="440" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="142" y="438" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0f2a44">Instrument cost first</text><text x="142" y="470" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#5b6b7f">the invoice always arrives</text><circle cx="92" cy="506" r="26" fill="#0f2a44"/><text x="92" y="516" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="142" y="514" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0f2a44">Leave a runnable team</text><text x="142" y="546" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#5b6b7f">judge by month 6</text>
