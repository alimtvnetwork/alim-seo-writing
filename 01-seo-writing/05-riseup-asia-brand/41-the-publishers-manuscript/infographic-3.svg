<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><title>5 Publishing AI Risks</title><rect width="1200" height="630" fill="#faf7f0"/><text x="600" y="606" font-size="15" fill="#8a7f6a" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">RISEUP ASIA LLC · story series</text><text x="600" y="64.0" font-size="34" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">5 Publishing AI Risks</tspan></text><text x="600" y="108.0" font-size="18" fill="#8a7f6a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">ranked by how quietly each damages the list · narrator's judgment</tspan></text><rect x="520" y="126" width="160" height="5" rx="2.5" fill="#6b4a8a"/><circle cx="1090" cy="64" r="24" fill="none" stroke="#6b4a8a" stroke-width="5"/><line x1="1107" y1="81" x2="1126" y2="100" stroke="#6b4a8a" stroke-width="7" stroke-linecap="round"/><circle cx="120" cy="190" r="28" fill="#1a2b4a"/><text x="120" y="200" font-size="28" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">1</text><rect x="170" y="154" width="900" height="72" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="620" y="181.0" font-size="22" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">Training on the already-successful</tspan></text><text x="620" y="209.0" font-size="17" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">rejects the unprecedented — the only thing worth publishing</tspan></text><circle cx="120" cy="272" r="28" fill="#1a2b4a"/><text x="120" y="282" font-size="28" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">2</text><rect x="170" y="236" width="900" height="72" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="620" y="263.0" font-size="22" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">Confusing throughput with taste</tspan></text><text x="620" y="291.0" font-size="17" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">speed feels like progress until the list goes stale</tspan></text><circle cx="120" cy="354" r="28" fill="#1a2b4a"/><text x="120" y="364" font-size="28" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">3</text><rect x="170" y="318" width="900" height="72" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="620" y="345.0" font-size="22" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">Losing the margin notes</tspan></text><text x="620" y="373.0" font-size="17" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">craft knowledge evaporates when the machine skips the reading</tspan></text><circle cx="120" cy="436" r="28" fill="#1a2b4a"/><text x="120" y="446" font-size="28" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">4</text><rect x="170" y="400" width="900" height="72" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="620" y="427.0" font-size="22" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">The author's trust deficit</tspan></text><text x="620" y="455.0" font-size="17" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">writers avoid the house that lets a model judge art</tspan></text><circle cx="120" cy="518" r="28" fill="#1a2b4a"/><text x="120" y="528" font-size="28" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">5</text><rect x="170" y="482" width="900" height="72" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="620" y="509.0" font-size="22" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">Cost blindness at scale</tspan></text><text x="620" y="537.0" font-size="17" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">the slush triples, and finance notices eventually</tspan></text><text x="600" y="590.0" font-size="17" fill="#8a7f6a" text-anchor="middle" font-weight="italic" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">The pencil still owns the maybe pile.</tspan></text></svg>