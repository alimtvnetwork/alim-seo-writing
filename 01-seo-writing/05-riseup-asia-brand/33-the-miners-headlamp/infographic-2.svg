<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><title>Extend the Tag Board, Don't Replace It</title><rect width="1200" height="630" fill="#faf7f0"/><text x="600" y="606" font-size="15" fill="#8a7f6a" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">RISEUP ASIA LLC · story series</text><text x="600" y="64.0" font-size="34" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">Extend the Tag Board, Don't Replace It</tspan></text><text x="600" y="108.0" font-size="18" fill="#8a7f6a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">how engineer-led instrumentation grows from what already works</tspan></text><rect x="520" y="126" width="160" height="5" rx="2.5" fill="#c47b2a"/><circle cx="1090" cy="64" r="24" fill="none" stroke="#c47b2a" stroke-width="5"/><line x1="1107" y1="81" x2="1126" y2="100" stroke="#c47b2a" stroke-width="7" stroke-linecap="round"/><rect x="36" y="220" width="184" height="140" rx="14" fill="#c47b2a" stroke="#1a2b4a" stroke-width="3"/><text x="128.0" y="277.2" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="128.0" dy="0">The plywood tag</tspan><tspan x="128.0" dy="25.650000000000002">board</tspan></text><line x1="220" y1="290.0" x2="238" y2="290.0" stroke="#c47b2a" stroke-width="4"/><polygon points="236,281.0 236,299.0 248,290.0" fill="#c47b2a"/><rect x="238" y="220" width="184" height="140" rx="14" fill="#ffffff" stroke="#1a2b4a" stroke-width="3"/><text x="330.0" y="277.2" font-size="19" fill="#1a2b4a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="330.0" dy="0">Digitize the tag</tspan><tspan x="330.0" dy="25.650000000000002">exchange</tspan></text><line x1="422" y1="290.0" x2="440" y2="290.0" stroke="#c47b2a" stroke-width="4"/><polygon points="438,281.0 438,299.0 450,290.0" fill="#c47b2a"/><rect x="440" y="220" width="184" height="140" rx="14" fill="#ffffff" stroke="#1a2b4a" stroke-width="3"/><text x="532.0" y="264.4" font-size="19" fill="#1a2b4a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="532.0" dy="0">Add gas &amp;</tspan><tspan x="532.0" dy="25.650000000000002">proximity</tspan><tspan x="532.0" dy="25.650000000000002">sensors</tspan></text><line x1="624" y1="290.0" x2="642" y2="290.0" stroke="#c47b2a" stroke-width="4"/><polygon points="640,281.0 640,299.0 652,290.0" fill="#c47b2a"/><rect x="642" y="220" width="184" height="140" rx="14" fill="#ffffff" stroke="#1a2b4a" stroke-width="3"/><text x="734.0" y="264.4" font-size="19" fill="#1a2b4a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="734.0" dy="0">Model reads only</tspan><tspan x="734.0" dy="25.650000000000002">what humans</tspan><tspan x="734.0" dy="25.650000000000002">can't</tspan></text><line x1="826" y1="290.0" x2="844" y2="290.0" stroke="#c47b2a" stroke-width="4"/><polygon points="842,281.0 842,299.0 854,290.0" fill="#c47b2a"/><rect x="844" y="220" width="184" height="140" rx="14" fill="#ffffff" stroke="#1a2b4a" stroke-width="3"/><text x="936.0" y="264.4" font-size="19" fill="#1a2b4a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="936.0" dy="0">The officer</tspan><tspan x="936.0" dy="25.650000000000002">still owns the</tspan><tspan x="936.0" dy="25.650000000000002">book</tspan></text><rect x="90" y="440" width="320" height="92" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="250" y="457.9" font-size="18" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="250" dy="0">Dust blinds cameras by mid-</tspan><tspan x="250" dy="24.3">morning.</tspan></text><text x="250" y="502.0" font-size="15" fill="#8a7f6a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="250" dy="0">design for the pit, not the demo</tspan></text><rect x="450" y="440" width="320" height="92" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="610" y="457.9" font-size="18" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="610" dy="0">The network dies at the</tspan><tspan x="610" dy="24.3">bottom.</tspan></text><text x="610" y="502.0" font-size="15" fill="#8a7f6a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="610" dy="0">offline is a feature</tspan></text><rect x="810" y="440" width="320" height="92" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="970" y="457.9" font-size="18" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="970" dy="0">Nobody leaves until all tags</tspan><tspan x="970" dy="24.3">are home.</tspan></text><text x="970" y="502.0" font-size="15" fill="#8a7f6a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="970" dy="0">accountability stays human</tspan></text></svg>