" y="278" font-family="system-ui, sans-serif" font-size="22" fill="#1a1a1a">document</text><circle cx="654" cy="348" r="7" fill="#1e7d34"/><text x="676" y="356" font-family="system-ui, sans-serif" font-size="22" fill="#1a1a1a">Publishes</text><text x="676" y="386" font-family="system-ui, sans-serif" font-size="22" fill="#1a1a1a">uncertainty</text><circle cx="654" cy="456" r="7" fill="#1e7d34"/><text x="676" y="464" font-family="system-ui, sans-serif" font-size="22" fill="#1a1a1a">Keeps the valuer's</text><text x="676" y="494" font-family="system-ui, sans-serif" font-size="22" fill="#1a1a1a">signature</text><text x="60" y="606" font-family="system-ui, sans-serif" font-size="15" fill="#9a9a9a">RISEUP ASIA LLC · story series</text><line x1="60" y1="586" x2="1140" y2="586" stroke="#e2e2e2" stroke-width="1"/></svg>