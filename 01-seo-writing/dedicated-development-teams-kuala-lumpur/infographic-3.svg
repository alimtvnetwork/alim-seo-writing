<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect x="0" y="0" width="1200" height="630" fill="#ffffff"/><rect x="0" y="0" width="1200" height="188" fill="#1b2a4a"/><text x="40" y="58" font-size="33" fill="#ffffff" font-weight="bold">Dedicated Development Teams in Kuala Lumpur:</text><text x="40" y="102" font-size="33" fill="#ffffff" font-weight="bold">What Actually Works</text><text x="40" y="152" font-size="21" fill="#cbd5e1">Kuala Lumpur: a team, not a crowd</text><text x="40" y="606" font-size="15" fill="#94a3b8">RISEUP ASIA LLC · story series</text><text x="40" y="218" font-size="18" fill="#b7791f" font-weight="normal" text-anchor="start">Criterion: ownership of a single outcome (narrator&#x27;s editorial judgment)</text><circle cx="64" cy="246" r="19" fill="#1b2a4a"/><text x="64" y="253" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="98" y="253" font-size="22" fill="#1b2a4a" font-weight="bold">A single accountable tech lead</text><text x="98" y="278" font-size="18" fill="#334155">Teams without owners drift; name the human</text><circle cx="64" cy="308" r="19" fill="#1b2a4a"/><text x="64" y="315" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="98" y="315" font-size="22" fill="#1b2a4a" font-weight="bold">A stable roster</text><text x="98" y="340" font-size="18" fill="#334155">Churn kills context; measure health in tenure</text><circle cx="64" cy="370" r="19" fill="#1b2a4a"/><text x="64" y="377" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="98" y="377" font-size="22" fill="#1b2a4a" font-weight="bold">Client-side product ownership</text><text x="98" y="402" font-size="18" fill="#334155">A team without a customer builds guesses</text><circle cx="64" cy="432" r="19" fill="#1b2a4a"/><text x="64" y="439" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="98" y="439" font-size="22" fill="#1b2a4a" font-weight="bold">Ruthless scope discipline</text><text x="98" y="464" font-size="18" fill="#334155">Small teams win by saying no</text><circle cx="64" cy="494" r="19" fill="#1b2a4a"/><text x="64" y="501" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="98" y="501" font-size="22" fill="#1b2a4a" font-weight="bold">Shared rituals</text><text x="98" y="526" font-size="18" fill="#334155">Retros, reviews, and 1am debugging build teams</text></svg>