<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>aiyo promo concept</title><desc>Layered recreation: dark promo card with pill badge and condensed headline.</desc>
<defs><pattern id="ag" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#0d0d10"/><line x1="0" y1="0" x2="0" y2="14" stroke="#1e1e24" stroke-width="1.5"/></pattern></defs>
<g id="bg-base"><rect width="1080" height="1350" fill="url(#ag)"/></g>
<g id="badge-pill"><rect x="770" y="120" width="130" height="64" rx="32" fill="#7c5cff"/>
<text x="835" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#ffffff">05</text></g>
<g id="headline"><text x="540" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="#ffffff" letter-spacing="2">PM TO GET</text><text x="540" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="900" fill="#ffffff" letter-spacing="2">FREE DEMO!</text></g>
<g id="subtext"><text x="540" y="740" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#cfcfd6">TO SEE HOW WE CAN</text><text x="540" y="790" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#cfcfd6">TAILOR-MADE FOR YOU</text></g>
</svg>