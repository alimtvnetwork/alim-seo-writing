"2"/><text x="600" y="278.0" font-size="24" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">The concierge that could not answer</tspan></text><text x="600" y="308.0" font-size="18" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">Failed in public, inside the boutique</tspan></text><circle cx="120" cy="382" r="30" fill="#1a2b4a"/><text x="120" y="393" font-size="30" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">3</text><rect x="170" y="344" width="900" height="76" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="600" y="374.0" font-size="24" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">Dynamic pricing that punished loyalty</tspan></text><text x="600" y="404.0" font-size="18" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">Contained, but the screenshots lived on</tspan></text><circle cx="120" cy="478" r="30" fill="#1a2b4a"/><text x="120" y="489" font-size="30" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">4</text><rect x="170" y="440" width="900" height="76" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="600" y="470.0" font-size="24" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">The AI-written heritage story</tspan></text><text x="600" y="500.0" font-size="18" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">Embarrassment — provenance is revenue</tspan></text><rect x="480" y="92" width="240" height="6" rx="3" fill="#b98a2f"/><circle cx="1080" cy="70" r="26" fill="none" stroke="#b98a2f" stroke-width="5"/><line x1="1099" y1="89" x2="1120" y2="110" stroke="#b98a2f" stroke-width="7" stroke-linecap="round"/></svg>