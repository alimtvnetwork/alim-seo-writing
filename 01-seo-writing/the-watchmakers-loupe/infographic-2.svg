<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><title>The harvest cycle: how engineers extract value from AI</title><rect width="1200" height="630" fill="#faf7f0"/><text x="600" y="606" font-size="15" fill="#8a7f6a" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">RISEUP ASIA LLC · story series</text><text x="600" y="70.0" font-size="36" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">The Harvest Cycle</tspan></text><rect x="40" y="200" width="180" height="150" rx="14" fill="#ffffff" stroke="#1a2b4a" stroke-width="3"/><text x="130.0" y="261.5" font-size="20" fill="#1a2b4a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="130.0" dy="0">Evaluate before</tspan><tspan x="130.0" dy="27.0">celebrating</tspan></text><line x1="220" y1="275.0" x2="240" y2="275.0" stroke="#b98a2f" stroke-width="4"/><polygon points="238,266.0 238,284.0 250,275.0" fill="#b98a2f"/><rect x="240" y="200" width="180" height="150" rx="14" fill="#ffffff" stroke="#1a2b4a" stroke-width="3"/><text x="330.0" y="248.0" font-size="20" fill="#1a2b4a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="330.0" dy="0">Ground retrieval</tspan><tspan x="330.0" dy="27.0">in real</tspan><tspan x="330.0" dy="27.0">documents</tspan></text><line x1="420" y1="275.0" x2="440" y2="275.0" stroke="#b98a2f" stroke-width="4"/><polygon points="438,266.0 438,284.0 450,275.0" fill="#b98a2f"/><rect x="440" y="200" width="180" height="150" rx="14" fill="#ffffff" stroke="#1a2b4a" stroke-width="3"/><text x="530.0" y="261.5" font-size="20" fill="#1a2b4a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="530.0" dy="0">Track cost per</tspan><tspan x="530.0" dy="27.0">run</tspan></text><line x1="620" y1="275.0" x2="640" y2="275.0" stroke="#b98a2f" stroke-width="4"/><polygon points="638,266.0 638,284.0 650,275.0" fill="#b98a2f"/><rect x="640" y="200" width="180" height="150" rx="14" fill="#ffffff" stroke="#1a2b4a" stroke-width="3"/><text x="730.0" y="261.5" font-size="20" fill="#1a2b4a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="730.0" dy="0">Plan failure</tspan><tspan x="730.0" dy="27.0">paths</tspan></text><line x1="820" y1="275.0" x2="840" y2="275.0" stroke="#b98a2f" stroke-width="4"/><polygon points="838,266.0 838,284.0 850,275.0" fill="#b98a2f"/><rect x="840" y="200" width="180" height="150" rx="14" fill="#ffffff" stroke="#1a2b4a" stroke-width="3"/><text x="930.0" y="261.5" font-size="20" fill="#1a2b4a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="930.0" dy="0">Own the outcome</tspan><tspan x="930.0" dy="27.0">by name</tspan></text><text x="600" y="440" font-size="20" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">3 questions the loupe asks</text><rect x="120" y="460" width="300" height="70" rx="10" fill="#e9e2d2"/><text x="270" y="486.2" font-size="16" fill="#1a2b4a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="270" dy="0">What does the data</tspan><tspan x="270" dy="21.6">actually contain?</tspan></text><rect x="460" y="460" width="300" height="70" rx="10" fill="#e9e2d2"/><text x="610" y="486.2" font-size="16" fill="#1a2b4a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="610" dy="0">What does a wrong answer</tspan><tspan x="610" dy="21.6">cost?</tspan></text><rect x="800" y="460" width="300" height="70" rx="10" fill="#e9e2d2"/><text x="950" y="486.2" font-size="16" fill="#1a2b4a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="950" dy="0">Who owns the outcome by</tspan><tspan x="950" dy="21.6">name?</tspan></text><text x="600" y="578" font-size="18" fill="#5a5348" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">Evaluate · Ground · Measure · Plan · Own — then repeat the loop.</text><rect x="480" y="92" width="240" height="6" rx="3" fill="#b98a2f"/><circle cx="1080" cy="70" r="26" fill="none" stroke="#b98a2f" stroke-width="5"/><line x1="1099" y1="89" x2="1120" y2="110" stroke="#b98a2f" stroke-width="7" stroke-linecap="round"/></svg>