ine</text><text x="98" y="464" font-size="18" fill="#334155">Stale indexes lie politely</text><circle cx="64" cy="494" r="19" fill="#1b2a4a"/><text x="64" y="501" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="98" y="501" font-size="22" fill="#1b2a4a" font-weight="bold">Human in the loop</text><text x="98" y="526" font-size="18" fill="#334155">Someone owns the wrong answer</text></svg>