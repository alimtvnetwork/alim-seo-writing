<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><rect width="1200" height="630" fill="white"/><text x="60" y="70" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="#1a1a1a">The documentation burden, in numbers</text><text x="60" y="106" font-family="system-ui, sans-serif" font-size="19" fill="#6e6e6e">University of Wisconsin / AMA study, Annals of Family Medicine</text><rect x="74" y="150" width="332" height="400" rx="14" fill="#fdecea"/><text x="240" y="300" font-family="system-ui, sans-serif" font-size="80" font-weight="bold" fill="#b3402a" text-anchor="middle">5.9h</text><text x="240" y="356" font-family="system-ui, sans-serif" font-size="20" fill="#444444" text-anchor="middle">of an 11.4-hour day</text><text x="240" y="386" font-family="system-ui, sans-serif" font-size="20" fill="#444444" text-anchor="middle">spent in the EHR</text><rect x="434" y="150" width="332" height="400" rx="14" fill="#fcf4e2"/><text x="600" y="300" font-family="system-ui, sans-serif" font-size="80" font-weight="bold" fill="#b07c14" text-anchor="middle">∼50%</text><text x="600" y="356" font-family="system-ui, sans-serif" font-size="20" fill="#444444" text-anchor="middle">of the workday on</text><text x="600" y="386" font-family="system-ui, sans-serif" font-size="20" fill="#444444" text-anchor="middle">data entry, not patients</text><rect x="794" y="150" width="332" height="400" rx="14" fill="#e8f0fa"/><text x="960" y="300" font-family="system-ui, sans-serif" font-size="80" font-weight="bold" fill="#1f5aa0" text-anchor="middle">2:1</text><text x="960" y="356" font-family="system-ui, sans-serif" font-size="20" fill="#444444" text-anchor="middle">hours of EHR work per</text><text x="960" y="386" font-family="system-ui, sans-serif" font-size="20" fill="#444444" text-anchor="middle">hour of patient care (AMA)</text><text x="60" y="606" font-family="system-ui, sans-serif" font-size="15" fill="#9a9a9a">RISEUP ASIA LLC · story series</text><line x1="60" y1="586" x2="1140" y2="586" stroke="#e2e2e2" stroke-width="1"/></svg>