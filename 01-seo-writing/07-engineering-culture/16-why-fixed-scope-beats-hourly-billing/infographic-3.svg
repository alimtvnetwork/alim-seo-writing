<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs><radialGradient id="gl"><stop offset="0%" stop-color="rgb(255,173,1)" stop-opacity="0.10"/><stop offset="100%" stop-color="rgb(255,173,1)" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="630" fill="#0B0A09"/>
<circle cx="600" cy="120" r="400" fill="url(#gl)"/>
<text x="600.0" y="106.0" font-family="Ubuntu, sans-serif" font-weight="700" font-size="50" fill="#F7F5F2" text-anchor="middle">BILLING MODELS, RANKED</text>
<text x="195.0" y="178.0" font-family="Ubuntu, sans-serif" font-weight="700" font-size="54" fill="#FFAD01" text-anchor="end">1</text>
<text x="235.0" y="160.0" font-family="Poppins, sans-serif" font-weight="600" font-size="27" fill="#F7F5F2" text-anchor="start">Fixed scope, acceptance criteria</text>
<text x="235.0" y="191.0" font-family="Poppins, sans-serif" font-weight="400" font-size="22" fill="#ADA8A2" text-anchor="start">Vendor profits from finishing well</text>
<text x="195.0" y="267.0" font-family="Ubuntu, sans-serif" font-weight="700" font-size="54" fill="#FFAD01" text-anchor="end">2</text>
<text x="235.0" y="248.0" font-family="Poppins, sans-serif" font-weight="600" font-size="27" fill="#F7F5F2" text-anchor="start">Fixed scope, discovery phase</text>
<text x="235.0" y="279.0" font-family="Poppins, sans-serif" font-weight="400" font-size="22" fill="#ADA8A2" text-anchor="start">Uncertainty gets its own price</text>
<text x="195.0" y="355.0" font-family="Ubuntu, sans-serif" font-weight="700" font-size="54" fill="#FFAD01" text-anchor="end">3</text>
<text x="235.0" y="336.0" font-family="Poppins, sans-serif" font-weight="600" font-size="27" fill="#F7F5F2" text-anchor="start">Capped time-and-materials</text>
