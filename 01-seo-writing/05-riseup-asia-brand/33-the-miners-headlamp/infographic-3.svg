<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><title>4 Industrial AI Realities</title><rect width="1200" height="630" fill="#faf7f0"/><text x="600" y="606" font-size="15" fill="#8a7f6a" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">RISEUP ASIA LLC · story series</text><text x="600" y="64.0" font-size="34" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">4 Industrial AI Realities</tspan></text><text x="600" y="95.8" font-size="18" fill="#8a7f6a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">ranked by what matters when lives are on the line · narrator's</tspan><tspan x="600" dy="24.3">judgment</tspan></text><rect x="520" y="126" width="160" height="5" rx="2.5" fill="#c47b2a"/><circle cx="1090" cy="64" r="24" fill="none" stroke="#c47b2a" stroke-width="5"/><line x1="1107" y1="81" x2="1126" y2="100" stroke="#c47b2a" stroke-width="7" stroke-linecap="round"/><circle cx="120" cy="190" r="28" fill="#1a2b4a"/><text x="120" y="200" font-size="28" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">1</text><rect x="170" y="154" width="900" height="72" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="620" y="181.0" font-size="22" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">The environment is the first specification</tspan></text><text x="620" y="209.0" font-size="17" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">dust, heat, dead zones are the job, not edge cases</tspan></text><circle cx="120" cy="286" r="28" fill="#1a2b4a"/><text x="120" y="296" font-size="28" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">2</text><rect x="170" y="250" width="900" height="72" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="620" y="277.0" font-size="22" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">Alert fatigue kills faster than silence</tspan></text><text x="620" y="305.0" font-size="17" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">the tag board never cried wolf — that is why it worked</tspan></text><circle cx="120" cy="382" r="28" fill="#1a2b4a"/><text x="120" y="392" font-size="28" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">3</text><rect x="170" y="346" width="900" height="72" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="620" y="373.0" font-size="22" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">Offline is a feature, not a fallback</tspan></text><text x="620" y="401.0" font-size="17" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">the pit has no patience for cloud-dependent safety</tspan></text><circle cx="120" cy="478" r="28" fill="#1a2b4a"/><text x="120" y="488" font-size="28" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">4</text><rect x="170" y="442" width="900" height="72" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="620" y="469.0" font-size="22" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">Accountability cannot be a bounding box</tspan></text><text x="620" y="497.0" font-size="17" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">in the end, the name in the book is the whole system</tspan></text><text x="600" y="566.0" font-size="19" fill="#5a5348" text-anchor="middle" font-weight="italic" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">Nobody leaves until all tags are home.</tspan></text></svg>