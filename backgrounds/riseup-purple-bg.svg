<svg xmlns="http://www.w3.org/2000/svg" width="2608" height="944" viewBox="0 0 2608 944">
  <title>riseup purple background</title>
  <desc>Purple background with RiseUp headline text and yellow Apply pill label.</desc>
  <defs>
