<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect x="0" y="0" width="1200" height="630" fill="#ffffff"/><rect x="0" y="0" width="1200" height="100" fill="#0f2a44"/><text x="56" y="63" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Best Software Engineers in Sheridan: What Actually Works</text><rect x="0" y="592" width="1200" height="38" fill="#eef2f7"/><text x="600" y="618" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b7f" text-anchor="middle" letter-spacing="2">RISEUP ASIA LLC &#183; story series</text><text x="600" y="150" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="23" font-style="italic" fill="#5b6b7f" text-anchor="middle">Criterion: which behaviors are observable in a Sheridan engineer first 90 days</text><circle cx="90" cy="193" r="24" fill="#0f2a44"/><text x="90" y="202" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="130" y="205" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2937">Read the system before changing it</text><text x="130" y="239" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b7f">WHY: treat unfamiliar systems like crime scenes</text><circle cx="90" cy="285" r="24" fill="#0f2a44"/><text x="90" y="294" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="130" y="297" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2937">Write things down unasked</text><text x="130" y="331" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b7f">WHY: writing is thinking made durable</text><circle cx="90" cy="377" r="24" fill="#0f2a44"/><text x="90" y="386" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="130" y="389" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2937">Own the incident, not just the fix</text><text x="130" y="423" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b7f">WHY: stay until the system is boring again</text><circle cx="90" cy="469" r="24" fill="#0f2a44"/><text x="90" y="478" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="130" y="481" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2937">Make people around them better</text><text x="130" y="515" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b7f">WHY: the trait that compounds</text></svg>