<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect x="0" y="0" width="1200" height="630" fill="#ffffff"/><rect x="0" y="0" width="1200" height="144" fill="#1b2a4a"/><text x="40" y="58" font-size="33" fill="#ffffff" font-weight="bold">The Evidence-Led Delivery Model</text><text x="40" y="108" font-size="21" fill="#cbd5e1">San Diego: proof before promises</text><text x="40" y="606" font-size="15" fill="#94a3b8">RISEUP ASIA LLC · story series</text><text x="40" y="174" font-size="18" fill="#b7791f" font-weight="normal" text-anchor="start">Criterion: proof produced before promises made (narrator&#x27;s editorial judgment)</text><circle cx="64" cy="202" r="19" fill="#1b2a4a"/><text x="64" y="209" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="98" y="209" font-size="22" fill="#1b2a4a" font-weight="bold">Measure the baseline</text><text x="98" y="234" font-size="18" fill="#334155">No baseline, no claim</text><circle cx="64" cy="264" r="19" fill="#1b2a4a"/><text x="64" y="271" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="98" y="271" font-size="22" fill="#1b2a4a" font-weight="bold">Ship the smallest proof</text><text x="98" y="296" font-size="18" fill="#334155">One workflow, fully instrumented</text><circle cx="64" cy="326" r="19" fill="#1b2a4a"/><text x="64" y="333" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="98" y="333" font-size="22" fill="#1b2a4a" font-weight="bold">Price the run</text><text x="98" y="358" font-size="18" fill="#334155">Every inference has a cost</text><circle cx="64" cy="388" r="19" fill="#1b2a4a"/><text x="64" y="395" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="98" y="395" font-size="22" fill="#1b2a4a" font-weight="bold">Name the owner</text><text x="98" y="420" font-size="18" fill="#334155">Someone owns the failure</text><circle cx="64" cy="450" r="19" fill="#1b2a4a"/><text x="64" y="457" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="98" y="457" font-size="22" fill="#1b2a4a" font-weight="bold">Show the receipt</text><text x="98" y="482" font-size="18" fill="#334155">The P&amp;L line that moved</text></svg>