<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect x="0" y="0" width="1200" height="630" fill="#ffffff"/><rect x="0" y="0" width="1200" height="188" fill="#1b2a4a"/><text x="40" y="58" font-size="33" fill="#ffffff" font-weight="bold">Best Software Engineers in Kuala Lumpur: What</text><text x="40" y="102" font-size="33" fill="#ffffff" font-weight="bold">Actually Works</text><text x="40" y="152" font-size="21" fill="#cbd5e1">Kuala Lumpur: separating the best from the busiest</text><text x="40" y="606" font-size="15" fill="#94a3b8">RISEUP ASIA LLC · story series</text><text x="40" y="218" font-size="18" fill="#b7791f" font-weight="normal" text-anchor="start">Criterion: evidence of shipped, measured work (narrator&#x27;s editorial judgment)</text><circle cx="64" cy="246" r="19" fill="#1b2a4a"/><text x="64" y="253" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="98" y="253" font-size="22" fill="#1b2a4a" font-weight="bold">Production ownership</text><text x="98" y="278" font-size="18" fill="#334155">Survived incidents and scaling pain; judgment no course teaches</text><circle cx="64" cy="308" r="19" fill="#1b2a4a"/><text x="64" y="315" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="98" y="315" font-size="22" fill="#1b2a4a" font-weight="bold">Measurement discipline</text><text x="98" y="340" font-size="18" fill="#334155">Instruments first, argues from numbers, shows before and after</text><circle cx="64" cy="370" r="19" fill="#1b2a4a"/><text x="64" y="377" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="98" y="377" font-size="22" fill="#1b2a4a" font-weight="bold">Failure-path thinking</text><text x="98" y="402" font-size="18" fill="#334155">Designs for the bad day; saves the company on the good ones</text><circle cx="64" cy="432" r="19" fill="#1b2a4a"/><text x="64" y="439" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="98" y="439" font-size="22" fill="#1b2a4a" font-weight="bold">Cost awareness</text><text x="98" y="464" font-size="18" fill="#334155">Treats infrastructure spend as a design constraint</text><circle cx="64" cy="494" r="19" fill="#1b2a4a"/><text x="64" y="501" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="98" y="501" font-size="22" fill="#1b2a4a" font-weight="bold">Communication clarity</text><text x="98" y="526" font-size="18" fill="#334155">Clear handoffs; honest status updates as engineering skill</text></svg>