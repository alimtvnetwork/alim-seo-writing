<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect x="0" y="0" width="1200" height="630" fill="#ffffff"/><rect x="0" y="0" width="1200" height="188" fill="#1b2a4a"/><text x="40" y="58" font-size="33" fill="#ffffff" font-weight="bold">Ai Software Development in Kuala Lumpur: What</text><text x="40" y="102" font-size="33" fill="#ffffff" font-weight="bold">Actually Works</text><text x="40" y="152" font-size="21" fill="#cbd5e1">Kuala Lumpur: from AI spending to AI earning</text><text x="40" y="606" font-size="15" fill="#94a3b8">RISEUP ASIA LLC · story series</text><text x="40" y="218" font-size="18" fill="#b7791f" font-weight="normal" text-anchor="start">Criterion: accountability for measurable business value (narrator&#x27;s editorial</text><text x="40" y="241" font-size="18" fill="#b7791f" font-weight="normal" text-anchor="start">judgment)</text><circle cx="64" cy="269" r="19" fill="#1b2a4a"/><text x="64" y="276" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="98" y="276" font-size="22" fill="#1b2a4a" font-weight="bold">Name the pain before the model</text><text x="98" y="301" font-size="18" fill="#334155">No named cost, no project worth funding</text><circle cx="64" cy="331" r="19" fill="#1b2a4a"/><text x="64" y="338" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="98" y="338" font-size="22" fill="#1b2a4a" font-weight="bold">Instrument the baseline</text><text x="98" y="363" font-size="18" fill="#334155">You cannot improve what you never measured</text><circle cx="64" cy="393" r="19" fill="#1b2a4a"/><text x="64" y="400" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="98" y="400" font-size="22" fill="#1b2a4a" font-weight="bold">Ship the smallest working slice</text><text x="98" y="425" font-size="18" fill="#334155">90-day windows beat 9-month programs</text><circle cx="64" cy="455" r="19" fill="#1b2a4a"/><text x="64" y="462" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="98" y="462" font-size="22" fill="#1b2a4a" font-weight="bold">Price every run</text><text x="98" y="487" font-size="18" fill="#334155">Cost per inference is a design input</text><circle cx="64" cy="517" r="19" fill="#1b2a4a"/><text x="64" y="524" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="98" y="524" font-size="22" fill="#1b2a4a" font-weight="bold">Keep a human accountable</text><text x="98" y="549" font-size="18" fill="#334155">Someone owns the wrong answer</text></svg>