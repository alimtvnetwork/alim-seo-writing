<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><rect width="1200" height="630" fill="white"/><text x="60" y="70" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="#1a1a1a">5 retrieval lessons from librarians</text><text x="60" y="106" font-family="system-ui, sans-serif" font-size="19" fill="#6e6e6e">Narrator's editorial judgment — ranked by value if learned tomorrow</text><circle cx="112" cy="192" r="27" fill="#1f5aa0"/><text x="112" y="201" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">1</text><text x="160" y="188" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" fill="#1a1a1a">“I don't know” is a feature</text><text x="160" y="220" font-family="system-ui, sans-serif" font-size="19" fill="#555555">Abstention builds trust; invention destroys it</text><circle cx="112" cy="275" r="27" fill="#1f5aa0"/><text x="112" y="284" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">2</text><text x="160" y="271" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" fill="#1a1a1a">The index is the product</text><text x="160" y="303" font-family="system-ui, sans-serif" font-size="19" fill="#555555">Curation beats model size, measurably</text><circle cx="112" cy="358" r="27" fill="#1f5aa0"/><text x="112" y="367" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">3</text><text x="160" y="354" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" fill="#1a1a1a">Evaluate with real questions</text><text x="160" y="386" font-family="system-ui, sans-serif" font-size="19" fill="#555555">Grade every change against known answers</text><circle cx="112" cy="441" r="27" fill="#1f5aa0"/><text x="112" y="450" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">4</t