<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect x="0" y="0" width="1200" height="630" fill="#ffffff"/><rect x="0" y="0" width="1200" height="188" fill="#1b2a4a"/><text x="40" y="58" font-size="33" fill="#ffffff" font-weight="bold">Ai Consulting in Kuala Lumpur: What Actually</text><text x="40" y="102" font-size="33" fill="#ffffff" font-weight="bold">Works</text><text x="40" y="152" font-size="21" fill="#cbd5e1">Kuala Lumpur: buying advice vs buying outcomes</text><text x="40" y="606" font-size="15" fill="#94a3b8">RISEUP ASIA LLC · story series</text><text x="40" y="218" font-size="18" fill="#b7791f" font-weight="normal" text-anchor="start">Criterion: questions that separate outcome-sellers from advice-sellers (narrator&#x27;s</text><text x="40" y="241" font-size="18" fill="#b7791f" font-weight="normal" text-anchor="start">editorial judgment)</text><circle cx="64" cy="269" r="19" fill="#1b2a4a"/><text x="64" y="276" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="98" y="276" font-size="22" fill="#1b2a4a" font-weight="bold">What runs in production on day 90?</text><text x="98" y="301" font-size="18" fill="#334155">A firm that cannot name it sells hours, not outcomes</text><circle cx="64" cy="331" r="19" fill="#1b2a4a"/><text x="64" y="338" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="98" y="338" font-size="22" fill="#1b2a4a" font-weight="bold">Who owns it when the model is wrong?</text><text x="98" y="363" font-size="18" fill="#334155">AI fails probabilistically; the owner must be named</text><circle cx="64" cy="393" r="19" fill="#1b2a4a"/><text x="64" y="400" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="98" y="400" font-size="22" fill="#1b2a4a" font-weight="bold">Show me a system you shipped</text><text x="98" y="425" font-size="18" fill="#334155">Shipped software is the only credential that matters</text><circle cx="64" cy="455" r="19" fill="#1b2a4a"/><text x="64" y="462" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="98" y="462" font-size="22" fill="#1b2a4a" font-weight="bold">How does knowledge transfer work?</text><text x="98" y="487" font-size="18" fill="#334155">No transfer means you bought dependency</text><circle cx="64" cy="517" r="19" fill="#1b2a4a"/><text x="64" y="524" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="98" y="524" font-size="22" fill="#1b2a4a" font-weight="bold">What does one run cost at scale?</text><text x="98" y="549" font-size="18" fill="#334155">Token economics are a deliverable, not a footnote</text></svg>