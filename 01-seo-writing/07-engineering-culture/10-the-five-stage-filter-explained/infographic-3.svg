<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect x="0" y="0" width="1200" height="630" fill="#ffffff"/><rect x="0" y="0" width="1200" height="144" fill="#1b2a4a"/><text x="40" y="58" font-size="33" fill="#ffffff" font-weight="bold">The Five-Stage Filter, Explained</text><text x="40" y="108" font-size="21" fill="#cbd5e1">New York: five gates, no shortcuts</text><text x="40" y="606" font-size="15" fill="#94a3b8">RISEUP ASIA LLC · story series</text><text x="40" y="174" font-size="18" fill="#b7791f" font-weight="normal" text-anchor="start">Criterion: each stage must produce evidence the previous one could not (narrator&#x27;s</text><text x="40" y="197" font-size="18" fill="#b7791f" font-weight="normal" text-anchor="start">editorial judgment)</text><circle cx="64" cy="225" r="19" fill="#1b2a4a"/><text x="64" y="232" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="98" y="232" font-size="22" fill="#1b2a4a" font-weight="bold">Stage 1: the portfolio screen</text><text x="98" y="257" font-size="18" fill="#334155">Shipped work or no conversation</text><circle cx="64" cy="287" r="19" fill="#1b2a4a"/><text x="64" y="294" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="98" y="294" font-size="22" fill="#1b2a4a" font-weight="bold">Stage 2: the paid trial</text><text x="98" y="319" font-size="18" fill="#334155">Real work, real pay, real signal</text><circle cx="64" cy="349" r="19" fill="#1b2a4a"/><text x="64" y="356" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="98" y="356" font-size="22" fill="#1b2a4a" font-weight="bold">Stage 3: the incident interview</text><text x="98" y="381" font-size="18" fill="#334155">Failure stories reveal judgment</text><circle cx="64" cy="411" r="19" fill="#1b2a4a"/><text x="64" y="418" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="98" y="418" font-size="22" fill="#1b2a4a" font-weight="bold">Stage 4: the systems review</text><text x="98" y="443" font-size="18" fill="#334155">Architecture thinking under pressure</text><circle cx="64" cy="473" r="19" fill="#1b2a4a"/><text x="64" y="480" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="98" y="480" font-size="22" fill="#1b2a4a" font-weight="bold">Stage 5: the client fit</text><text x="98" y="505" font-size="18" fill="#334155">The team decides who joins it</text></svg>