<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628"><title>kahf trust concept</title><desc>Layered recreation: trust tagline lockup. Add your own shield mark in the logo-mark group.</desc>
<g id="bg-base"><rect width="1200" height="628" fill="#f2f3f5"/></g>
<g id="logo-mark"><!-- replace with your shield/logo mark --><rect x="120" y="180" width="220" height="260" rx="40" fill="none" stroke="#5b3df0" stroke-width="6" stroke-dasharray="18 12"/></g>
<g id="tagline"><text x="420" y="330" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="400" letter-spacing="14" fill="#1a1a1a">YOU ARE SAFE HERE</text></g>
</svg>