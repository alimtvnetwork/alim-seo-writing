<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>meme concept</title><desc>Layered recreation: two-tone room, meme captions. Characters are labeled photo placeholders.</desc>
<defs><linearGradient id="mbg9" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bfe3ea"/><stop offset="62%" stop-color="#bfe3ea"/><stop offset="64%" stop-color="#b08d5f"/><stop offset="100%" stop-color="#9a7849"/></linearGradient></defs>
<g id="bg-base"><rect width="1080" height="1350" fill="url(#mbg9)"/></g>
<g id="caption-top-left"><text x="60" y="120" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#fff" stroke="#111" stroke-width="2">Serial</text><text x="60" y="200" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#fff" stroke="#111" stroke-width="2">Killers</text></g>
<g id="caption-top-right"><text x="1020" y="120" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#fff" stroke="#111" stroke-width="2">Psychopaths</text></g>
<g id="photo-characters"><rect x="60" y="280" width="440" height="560" fill="none" stroke="#111" stroke-width="4" stroke-dasharray="20 14" opacity="0.6"/><text x="280" y="570" text-anchor="middle" font-family="Arial" font-size="30" fill="#111" opacity="0.6">photo: characters</text></g>
<g id="caption-bottom"><text x="540" y="1000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#fff" stroke="#111" stroke-width="2">Those who code 1000+ lines</text><text x="540" y="1070" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#fff" stroke="#111" stroke-width="2">on notepad without any internet</text><text x="540" y="1140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#fff" stroke="#111" stroke-width="2">support and it compiles with</text><text x="540" y="1210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#fff" stroke="#111" stroke-width="2">0 errors and 0 warning</text></g>
</svg>