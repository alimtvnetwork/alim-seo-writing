<g id="bg-base"><rect width="1200" height="1200" fill="#fdfdff"/></g>
<g id="bg-wash"><rect width="1200" height="1200" fill="url(#dbg)"/></g>
<g id="selection-rect"><rect x="280" y="280" width="560" height="560" fill="none" stroke="#2f9be8" stroke-width="3"/>
<rect x="272" y="272" width="16" height="16" fill="#fff" stroke="#2f9be8" stroke-width="3"/><rect x="832" y="272" width="16" height="16" fill="#fff" stroke="#2f9be8" stroke-width="3"/><rect x="272" y="832" width="16" height="16" fill="#fff" stroke="#2f9be8" stroke-width="3"/><rect x="832" y="832" width="16" height="16" fill="#fff" stroke="#2f9be8" stroke-width="3"/></g>
