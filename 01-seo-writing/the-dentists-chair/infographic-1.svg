<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><rect width="1200" height="630" fill="white"/><text x="60" y="70" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="#1a1a1a">Two clinics, two schedules</text><text x="60" y="106" font-family="system-ui, sans-serif" font-size="19" fill="#6e6e6e">What each approach actually optimizes</text><rect x="60" y="130" width="520" height="440" rx="14" fill="#fdecea"/><rect x="60" y="130" width="520" height="62" rx="14" fill="#b3402a"/><rect x="60" y="176" width="520" height="16" fill="#b3402a"/><text x="86" y="171" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" fill="white">The AI-spending clinic</text><circle cx="94" cy="240" r="7" fill="#b3402a"/><text x="116" y="248" font-family="system-ui, sans-serif" font-size="22" fill="#1a1a1a">Buys the prediction</text><text x="116" y="278" font-family="system-ui, sans-serif" font-size="22" fill="#1a1a1a">oracle</text><circle cx="94" cy="348" r="7" fill="#b3402a"/><text x="116" y="356" font-family="system-ui, sans-serif" font-size="22" fill="#1a1a1a">Optimizes the model's</text><text x="116" y="386" font-family="system-ui, sans-serif" font-size="22" fill="#1a1a1a">own metric</text><circle cx="94" cy="456" r="7" fill="#b3402a"/><text x="116" y="464" font-family="system-ui, sans-serif" font-size="22" fill="#1a1a1a">Keeps phoning</text><text x="116" y="494" font-family="system-ui, sans-serif" font-size="22" fill="#1a1a1a">the waitlist</text><rect x="620" y="130" width="520" height="440" rx="14" fill="#e9f5ec"/><rect x="620" y="130" width="520" height="62" rx="14" fill="#1e7d34"/><rect x="620" y="176" width="520" height="16" fill="#1e7d34"/><text x="646" y="171" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" fill="white">The engineer-led clinic</text><circle cx="654" cy="240" r="7" fill="#1e7d34"/><text x="676" y="248" font-family="system-ui, sans-serif" font-size="22" fill="#1a1a1