<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><rect width="1200" height="630" fill="white"/><text x="60" y="70" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="#1a1a1a">5 signs of a serious engineering bootcamp</text><text x="60" y="106" font-family="system-ui, sans-serif" font-size="19" fill="#6e6e6e">Narrator's editorial judgment — ranked by how hard each sign is to fake</text><circle cx="112" cy="192" r="27" fill="#1f5aa0"/><text x="112" y="201" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">1</text><text x="160" y="188" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" fill="#1a1a1a">Students can explain a failure</text><text x="160" y="220" font-family="system-ui, sans-serif" font-size="19" fill="#555555">Real debugging stories require real broken systems</text><circle cx="112" cy="275" r="27" fill="#1f5aa0"/><text x="112" y="284" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">2</text><text x="160" y="271" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" fill="#1a1a1a">Cost per run is measured</text><text x="160" y="303" font-family="system-ui, sans-serif" font-size="19" fill="#555555">Production has a price tag; demos do not</text><circle cx="112" cy="358" r="27" fill="#1f5aa0"/><text x="112" y="367" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">3</text><text x="160" y="354" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" fill="#1a1a1a">Retrieval before generation</text><text x="160" y="386" font-family="system-ui, sans-serif" font-size="19" fill="#555555">Pipelines first, chatbots second</text><circle cx="112" cy="441" r="27" fill="#1f5aa0"/><text x="112" y="450" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">4</text><text x="160" y="437" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" fill="#1a1a1a">Instructors ship real systems</text><text x="160" y="469" font-family="system-ui, sans-serif" font-size="19" fill="#555555">Production scars beat keynote slides</text><circle cx="112" cy="524" r="27" fill="#1f5aa0"/><text x="112" y="533" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">5</text><text x="160" y="520" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" fill="#1a1a1a">Evaluation is graded</text><text x="160" y="552" font-family="system-ui, sans-serif" font-size="19" fill="#555555">Hidden test cases, not vibes</text><text x="60" y="606" font-family="system-ui, sans-serif" font-size="15" fill="#9a9a9a">RISEUP ASIA LLC · story series</text><line x1="60" y1="586" x2="1140" y2="586" stroke="#e2e2e2" stroke-width="1"/></svg>