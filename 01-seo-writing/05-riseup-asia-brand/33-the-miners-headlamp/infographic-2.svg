<text x="600.0" y="106.0" font-family="Ubuntu, sans-serif" font-weight="700" font-size="50" fill="#F7F5F2" text-anchor="middle">FROM TAG BOARD TO SENSORS</text>
<text x="195.0" y="171.0" font-family="Ubuntu, sans-serif" font-weight="700" font-size="54" fill="#FFAD01" text-anchor="end">1</text>
<text x="235.0" y="152.0" font-family="Poppins, sans-serif" font-weight="600" font-size="27" fill="#F7F5F2" text-anchor="start">Plywood tag board</text>
<text x="235.0" y="184.0" font-family="Poppins, sans-serif" font-weight="400" font-size="22" fill="#ADA8A2" text-anchor="start">the original source of truth</text>
<text x="195.0" y="260.0" font-family="Ubuntu, sans-serif" font-weight="700" font-size="54" fill="#FFAD01" text-anchor="end">2</text>
<text x="235.0" y="241.0" font-family="Poppins, sans-serif" font-weight="600" font-size="27" fill="#F7F5F2" text-anchor="start">Dust-proof the sensors</text>
<text x="235.0" y="272.0" font-family="Poppins, sans-serif" font-weight="400" font-size="22" fill="#ADA8A2" text-anchor="start">field note: dust</text>
