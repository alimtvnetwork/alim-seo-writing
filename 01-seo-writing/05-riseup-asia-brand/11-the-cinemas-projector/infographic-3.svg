r="28" fill="#1a2b4a"/><text x="120" y="296" font-size="28" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">2</text><rect x="170" y="250" width="900" height="72" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="620" y="277.0" font-size="22" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">The trailer pairing engine</tspan></text><text x="620" y="305.0" font-size="17" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">horror teasers before a children's matinee, per the metadata</tspan></text><circle cx="120" cy="382" r="28" fill="#1a2b4a"/><text x="120" y="392" font-size="28" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">3</text><rect x="170" y="346" width="900" height="72" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="620" y="373.0" font-size="22" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">Dynamic pricing vs the regulars</tspan></text><text x="620" y="401.0" font-size="17" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">loyalty treated as surge inventory; the wall cracked</tspan></text><circle cx="120" cy="478" r="28" fill="#1a2b4a"/><text x="120" y="488" font-size="28" fill="#faf7f0" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">4</text><rect x="170" y="442" width="900" height="72" rx="10" fill="#ffffff" stroke="#d8cfbc" stroke-width="2"/><text x="620" y="469.0" font-size="22" fill="#1a2b4a" text-anchor="middle" font-weight="bold" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">The chatbot box office</tspan></text><text x="620" y="497.0" font-size="17" fill="#5a5348" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="620" dy="0">cheerful sentences, zero explanations; irritation became habit</tspan></text><text x="600" y="566.0" font-size="17" fill="#8a7f6a" text-anchor="middle" font-weight="italic" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">The model can count the seats. The engineer watches the faces.</tspan></text><text x="600" y="581.9" font-size="15" fill="#8a7f6a" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><tspan x="600" dy="0">Serve the faces in the seats — the only optimization a cinema</tspan><tspan x="600" dy="20.25">needs.</tspan></text></svg>