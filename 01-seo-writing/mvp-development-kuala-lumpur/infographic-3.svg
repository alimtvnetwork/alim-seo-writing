<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect x="0" y="0" width="1200" height="630" fill="#ffffff"/><rect x="0" y="0" width="1200" height="188" fill="#1b2a4a"/><text x="40" y="58" font-size="33" fill="#ffffff" font-weight="bold">Mvp Development in Kuala Lumpur: What Actually</text><text x="40" y="102" font-size="33" fill="#ffffff" font-weight="bold">Works</text><text x="40" y="152" font-size="21" fill="#cbd5e1">Kuala Lumpur: ship the smallest thing that proves the most</text><text x="40" y="606" font-size="15" fill="#94a3b8">RISEUP ASIA LLC · story series</text><text x="40" y="218" font-size="18" fill="#b7791f" font-weight="normal" text-anchor="start">Criterion: learning per ringgit spent (narrator&#x27;s editorial judgment)</text><circle cx="64" cy="246" r="19" fill="#1b2a4a"/><text x="64" y="253" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="98" y="253" font-size="22" fill="#1b2a4a" font-weight="bold">20 customer conversations first</text><text x="98" y="278" font-size="18" fill="#334155">No market need kills 42%; conversations are cheap insurance</text><circle cx="64" cy="308" r="19" fill="#1b2a4a"/><text x="64" y="315" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="98" y="315" font-size="22" fill="#1b2a4a" font-weight="bold">One painful problem</text><text x="98" y="340" font-size="18" fill="#334155">An MVP that solves nothing crisply solves nothing</text><circle cx="64" cy="370" r="19" fill="#1b2a4a"/><text x="64" y="377" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="98" y="377" font-size="22" fill="#1b2a4a" font-weight="bold">The smallest shippable slice</text><text x="98" y="402" font-size="18" fill="#334155">If it takes 6 months, it is not an MVP</text><circle cx="64" cy="432" r="19" fill="#1b2a4a"/><text x="64" y="439" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="98" y="439" font-size="22" fill="#1b2a4a" font-weight="bold">Instrumented from day one</text><text x="98" y="464" font-size="18" fill="#334155">Retention is the only applause that counts</text><circle cx="64" cy="494" r="19" fill="#1b2a4a"/><text x="64" y="501" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="98" y="501" font-size="22" fill="#1b2a4a" font-weight="bold">Kill criteria in writing</text><text x="98" y="526" font-size="18" fill="#334155">Knowing when to stop is a feature</text></svg>