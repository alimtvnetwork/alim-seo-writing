  </g>
  <g id="triangle-watermark" opacity="0.22">
    <polygon points="1500,80 2350,860 650,860" fill="#5a2f85"/>
  </g>
  <g id="star-specks" fill="#ffffff">
    <circle cx="320" cy="700" r="4" opacity="0.6"/>
    <circle cx="780" cy="180" r="3" opacity="0.4"/>
    <circle cx="1050" cy="620" r="5" opacity="0.7"/>
    <circle cx="1420" cy="240" r="3" opacity="0.5"/>
    <circle cx="1700" cy="760" r="4" opacity="0.4"/>
    <circle cx="1980" cy="140" r="3" opacity="0.6"/>
    <circle cx="2230" cy="480" r="5" opacity="0.5"/>
    <circle cx="2450" cy="300" r="3" opacity="0.65"/>
    <circle cx="120" cy="320" r="3" opacity="0.35"/>
    <circle cx="560" cy="840" r="4" opacity="0.45"/>
    <circle cx="900" cy="420" r="3" opacity="0.55" fill="#c9a0ff"/>
    <circle cx="1300" cy="860" r="3" opacity="0.4" fill="#c9a0ff"/>
