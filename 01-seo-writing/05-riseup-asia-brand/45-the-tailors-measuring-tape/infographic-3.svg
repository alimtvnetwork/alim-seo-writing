<text x="235.0" y="241.0" font-family="Poppins, sans-serif" font-weight="600" font-size="27" fill="#F7F5F2" text-anchor="start">More sizes, fewer returns</text>
<text x="235.0" y="273.0" font-family="Poppins, sans-serif" font-weight="400" font-size="22" fill="#ADA8A2" text-anchor="start">inventory isn't insight</text>
