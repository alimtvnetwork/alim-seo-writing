<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>angular play dark background</title>
  <desc>Dark broadcast-style background with an original angular striped-play motif in brand yellow. Inspired by the NVIDIA Broadcast splash layout, with all brand marks removed and green replaced by yellow.</desc>
  <defs>
    <radialGradient id="darkLift" cx="42%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="60%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g id="bg-base">
    <rect width="1600" height="900" fill="url(#darkLift)"/>
  </g>
  <g id="sheen">
    <rect width="1600" height="900" fill="url(#sheen)"/>
  </g>
  <g id="motif-outline" opacity="0.14">
    <polygon points="480,260 860,450 480,640" fill="none" stroke="#ffc400" stroke-width="6"/>
  </g>
  <g id="motif-stripes" fill="#ffc400">
    <polygon points="520,300 780,300 720,370 520,370"/>
    <polygon points="520,410 700,410 640,480 520,480"/>
    <polygon points="520,520 620,520 560,590 520,590"/>
  </g>
  <g id="accent-line" opacity="0.85">
    <rect x="80" y="856" width="320" height="10" fill="#ffc400"/>
  </g>
</svg>
