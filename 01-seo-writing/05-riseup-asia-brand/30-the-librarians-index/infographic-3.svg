<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><rect width="1200" height="630" fill="white"/><text x="60" y="70" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="#1a1a1a">The retrieval loop</text><text x="60" y="106" font-family="system-ui, sans-serif" font-size="19" fill="#6e6e6e">The discipline librarians invented decades ago</text><rect x="60" y="250" width="179" height="150" rx="14" fill="#e8f0fa"/><text x="150" y="294" font-family="system-ui, sans-serif" font-size="19" fill="#1f5aa0" text-anchor="middle">STEP 1</text><text x="150" y="332" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ask the</text><text x="150" y="362" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">real question</text><line x1="245" y1="325" x2="277" y2="325" stroke="#1f5aa0" stroke-width="4"/><polygon points="277,313 277,337 287,325" fill="#1f5aa0"/><rect x="285" y="250" width="179" height="150" rx="14" fill="#e8f0fa"/><text x="375" y="294" font-family="system-ui, sans-serif" font-size="19" fill="#1f5aa0" text-anchor="middle">STEP 2</text><text x="375" y="332" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Retrieve</text><text x="375" y="362" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">from the index</text><line x1="470" y1="325" x2="502" y2="325" stroke="#1f5aa0" stroke-width="4"/><polygon points="502,313 502,337 512,325" fill="#1f5aa0"/><rect x="510" y="250" width="179" height="150" rx="14" fill="#e8f0fa"/><text x="600" y="294" font-family="system-ui, sans-serif" font-size="19" fill="#1f5aa0" text-anchor="middle">STEP 3</text><text x="600" y="332" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Verify</text><text x="600" y="362" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">the source</text><line x1="696" y1="325" x2="728" y2="325" stroke="#1f5aa0" stroke-width="4"/><polygon points="728,313 728,337 738,325" fill="#1f5aa0"/><rect x="736" y="250" width="179" height="150" rx="14" fill="#e8f0fa"/><text x="825" y="294" font-family="system-ui, sans-serif" font-size="19" fill="#1f5aa0" text-anchor="middle">STEP 4</text><text x="825" y="332" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Answer or</text><text x="825" y="362" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">abstain</text><line x1="921" y1="325" x2="953" y2="325" stroke="#1f5aa0" stroke-width="4"/><polygon points="953,313 953,337 963,325" fill="#1f5aa0"/><rect x="961" y="250" width="179" height="150" rx="14" fill="#e8f0fa"/><text x="1050" y="294" font-family="system-ui, sans-serif" font-size="19" fill="#1f5aa0" text-anchor="middle">STEP 5</text><text x="1050" y="332" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">File it</text><text x="1050" y="362" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" fill="#1a1a1a" text-anchor="middle">correctly</text><text x="600" y="480" font-family="system-ui, sans-serif" font-size="20" fill="#555555" text-anchor="middle">No answer without a retrievable source. Ever.</text><text x="60" y="606" font-family="system-ui, sans-serif" font-size="15" fill="#9a9a9a">RISEUP ASIA LLC · story series</text><line x1="60" y1="586" x2="1140" y2="586" stroke="#e2e2e2" stroke-width="1"/></svg>