<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect x="0" y="0" width="1200" height="630" fill="#ffffff"/><rect x="0" y="0" width="1200" height="188" fill="#1b2a4a"/><text x="40" y="58" font-size="33" fill="#ffffff" font-weight="bold">Staff Augmentation in Kuala Lumpur: What</text><text x="40" y="102" font-size="33" fill="#ffffff" font-weight="bold">Actually Works</text><text x="40" y="152" font-size="21" fill="#cbd5e1">Kuala Lumpur: renting hands vs building capability</text><text x="40" y="606" font-size="15" fill="#94a3b8">RISEUP ASIA LLC · story series</text><text x="40" y="218" font-size="18" fill="#b7791f" font-weight="normal" text-anchor="start">Criterion: capability left behind after the contract ends (narrator&#x27;s editorial</text><text x="40" y="241" font-size="18" fill="#b7791f" font-weight="normal" text-anchor="start">judgment)</text><circle cx="64" cy="269" r="19" fill="#1b2a4a"/><text x="64" y="276" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="98" y="276" font-size="22" fill="#1b2a4a" font-weight="bold">Senior-only augmentation</text><text x="98" y="301" font-size="18" fill="#334155">If they cannot review your code, it is decoration</text><circle cx="64" cy="331" r="19" fill="#1b2a4a"/><text x="64" y="338" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="98" y="338" font-size="22" fill="#1b2a4a" font-weight="bold">Embedded, not remote-only</text><text x="98" y="363" font-size="18" fill="#334155">Presence builds trust remote standups cannot</text><circle cx="64" cy="393" r="19" fill="#1b2a4a"/><text x="64" y="400" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="98" y="400" font-size="22" fill="#1b2a4a" font-weight="bold">Defined handover milestones</text><text x="98" y="425" font-size="18" fill="#334155">Knowledge transfer is a deliverable with dates</text><circle cx="64" cy="455" r="19" fill="#1b2a4a"/><text x="64" y="462" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="98" y="462" font-size="22" fill="#1b2a4a" font-weight="bold">Try-before-scale pilots</text><text x="98" y="487" font-size="18" fill="#334155">30 days proves more than 30 interviews</text><circle cx="64" cy="517" r="19" fill="#1b2a4a"/><text x="64" y="524" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="98" y="524" font-size="22" fill="#1b2a4a" font-weight="bold">Vetted-bench partnerships</text><text x="98" y="549" font-size="18" fill="#334155">Pre-vetted bench shortens hiring to weeks</text></svg>