<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs><radialGradient id="gl"><stop offset="0%" stop-color="rgb(255,173,1)" stop-opacity="0.10"/><stop offset="100%" stop-color="rgb(255,173,1)" stop-opacity="0"/></radialGradient></defs>
<rect width="1200" height="630" fill="#0B0A09"/>
<circle cx="600" cy="120" r="400" fill="url(#gl)"/>
<text x="600.0" y="106.0" font-family="Ubuntu, sans-serif" font-weight="700" font-size="50" fill="#F7F5F2" text-anchor="middle">5 VET-TECH AI CAUTIONS</text>
<text x="195.0" y="171.0" font-family="Ubuntu, sans-serif" font-weight="700" font-size="54" fill="#FFAD01" text-anchor="end">1</text>
<text x="235.0" y="153.0" font-family="Poppins, sans-serif" font-weight="600" font-size="27" fill="#F7F5F2" text-anchor="start">Never let the model diagnose</text>
<text x="235.0" y="184.0" font-family="Poppins, sans-serif" font-weight="400" font-size="22" fill="#ADA8A2" text-anchor="start">suggestion, not verdict</text>
<text x="195.0" y="260.0" font-family="Ubuntu, sans-serif" font-weight="700" font-size="54" fill="#FFAD01" text-anchor="end">2</text>
<text x="235.0" y="241.0" font-family="Poppins, sans-serif" font-weight="600" font-size="27" fill="#F7F5F2" text-anchor="start">Ground in the patient record</text>
<text x="235.0" y="272.0" font-family="Poppins, sans-serif" font-weight="400" font-size="22" fill="#ADA8A2" text-anchor="start">this animal, not averages</text>
<text x="195.0" y="348.0" font-family="Ubuntu, sans-serif" font-weight="700" font-size="54" fill="#FFAD01" text-anchor="end">3</text>
<text x="235.0" y="329.0" font-family="Poppins, sans-serif" font-weight="600" font-size="27" fill="#F7F5F2" text-anchor="start">Log every override</text>
<text x="235.0" y="360.0" font-family="Poppins, sans-serif" font-weight="400" font-size="22" fill="#ADA8A2" text-anchor="start">training data with fur</text>
<text x="195.0" y="435.0" font-family="Ubuntu, sans-serif" font-weight="700" font-size="54" fill="#FFAD01" text-anchor="end">4</text>
<text x="235.0" y="415.0" font-family="Poppins, sans-serif" font-weight="600" font-size="27" fill="#F7F5F2" text-anchor="start">Measure agreement, not usage</text>
<text x="235.0" y="448.0" font-family="Poppins, sans-serif" font-weight="400" font-size="22" fill="#ADA8A2" text-anchor="start">right, not often</text>
<text x="195.0" y="523.0" font-family="Ubuntu, sans-serif" font-weight="700" font-size="54" fill="#FFAD01" text-anchor="end">5</text>
<text x="235.0" y="505.0" font-family="Poppins, sans-serif" font-weight="600" font-size="27" fill="#F7F5F2" text-anchor="start">Vet signs off comms</text>
<text x="235.0" y="536.0" font-family="Poppins, sans-serif" font-weight="400" font-size="22" fill="#ADA8A2" text-anchor="start">client hears the vet</text>
</svg>